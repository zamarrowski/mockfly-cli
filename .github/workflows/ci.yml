name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The same two checks .githooks/pre-commit runs, so a commit that passed the
  # hook cannot fail here. Node-version independent, hence its own job.
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` claims >=18, so every supported major has to stay green.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The --test-coverage-* threshold flags only exist from Node 22.
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn coverage
